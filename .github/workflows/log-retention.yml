name: Reconcile log retention
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: suburban-remote-log-retention
  cancel-in-progress: false
jobs:
  retention:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a
        with:
          retry-max-attempts: 1
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: gha-Suburban-Remote-retention-${{ github.run_id }}
          aws-region: us-east-1
          allowed-account-ids: ${{ vars.DEPLOY_AWS_ACCOUNT }}
      - name: Set and verify seven days in each active region
        env:
          AWS_PAGER: ''
        run: |
          set -euo pipefail
          regions=$(aws ec2 describe-regions --filters Name=opt-in-status,Values=opt-in-not-required,opted-in --query 'Regions[].RegionName' --output text)
          for region in $regions; do
            aws logs describe-log-groups --region "$region" --output json > /tmp/groups.json
            jq -c '.logGroups[] | select(.retentionInDays != 7)' /tmp/groups.json > /tmp/drift.jsonl
            while IFS= read -r row; do
              name=$(jq -r .logGroupName <<< "$row")
              before=$(jq -r '.retentionInDays // "never"' <<< "$row")
              aws logs put-retention-policy --region "$region" --log-group-name "$name" --retention-in-days 7
              printf '%s %s: %s -> 7\n' "$region" "$name" "$before"
            done < /tmp/drift.jsonl
            aws logs describe-log-groups --region "$region" --output json | jq -e 'all(.logGroups[]; .retentionInDays == 7)'
          done
